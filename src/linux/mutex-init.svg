<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .addr-label { font-family: monospace; font-size: 12px; fill: #64748b; }
      .field-title { font-family: monospace; font-size: 13px; font-weight: bold; fill: #1e293b; }
      .field-val { font-family: monospace; font-size: 12px; fill: #334155; }
      .annot { font-family: sans-serif; font-size: 13px; fill: #dc2626; font-weight: bold; }
      .box-struct { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
      .box-field { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
      .box-field-list { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.5; rx: 4; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Left Column: Inside Mutex::new() on Stack -->
  <text x="190" y="30" class="title">1. Inside new() (Stack Address 0x1000)</text>

  <!-- Container for struct mutex at 0x1000 -->
  <rect x="40" y="55" width="300" height="180" class="box-struct" />
  <text x="55" y="78" class="addr-label">Address: 0x1000 (raw_mutex)</text>

  <!-- owner field -->
  <rect x="60" y="90" width="260" height="36" class="box-field" />
  <text x="75" y="113" class="field-val">owner = 0 (unlocked)</text>

  <!-- wait_list (list_head) field -->
  <rect x="60" y="135" width="260" height="85" class="box-field-list" />
  <text x="75" y="155" class="field-title">wait_list: struct list_head</text>
  <text x="75" y="178" class="field-val">.next = 0x1010 (&amp;wait_list)</text>
  <text x="75" y="200" class="field-val">.prev = 0x1010 (&amp;wait_list)</text>

  <!-- Self-referential loop arrows for list_head -->
  <path d="M 320 178 C 365 178, 365 145, 320 145" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-blue)" />
  <path d="M 320 200 C 375 200, 375 155, 320 155" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Move Arrow in Middle -->
  <path d="M 380 145 L 460 145" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)" />
  <text x="420" y="135" class="title" font-size="12px" fill="#64748b">Move</text>

  <!-- Right Column: After return (Moved to 0x5000) -->
  <text x="650" y="30" class="title">2. After Return (Moved to 0x5000)</text>

  <!-- Container for struct mutex moved to 0x5000 -->
  <rect x="500" y="55" width="300" height="180" class="box-struct" />
  <text x="515" y="78" class="addr-label">Address: 0x5000 (moved mutex)</text>

  <!-- owner field -->
  <rect x="520" y="90" width="260" height="36" class="box-field" />
  <text x="535" y="113" class="field-val">owner = 0 (unlocked)</text>

  <!-- wait_list field (still pointing to 0x1010!) -->
  <rect x="520" y="135" width="260" height="85" class="box-field-list" stroke="#dc2626" />
  <text x="535" y="155" class="field-title">wait_list: struct list_head</text>
  <text x="535" y="178" class="field-val" fill="#dc2626">.next = 0x1010 (Dangling!)</text>
  <text x="535" y="200" class="field-val" fill="#dc2626">.prev = 0x1010 (Dangling!)</text>

  <!-- Broken / Dangling Pointer Arrows back to old stack memory (0x1010) -->
  <path d="M 520 178 C 420 178, 390 175, 320 175" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />
  <path d="M 520 200 C 420 200, 390 195, 320 195" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />

  <!-- Annotation at bottom -->
  <text x="420" y="268" class="annot" text-anchor="middle">⚠️ next and prev still point to old stack memory (0x1010) instead of new location (0x5010)!</text>
</svg>
