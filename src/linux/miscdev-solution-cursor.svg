<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .addr-label { font-family: monospace; font-size: 12px; fill: #64748b; }
      .field-title { font-family: monospace; font-size: 13px; font-weight: bold; fill: #1e293b; }
      .field-val { font-family: monospace; font-size: 12px; fill: #334155; }
      .annot { font-family: sans-serif; font-size: 13px; fill: #64748b; font-weight: bold; text-anchor: middle; }
      .index-label { font-family: sans-serif; font-size: 12px; fill: #64748b; font-style: italic; }
      .new-tag-text { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #047857; text-anchor: middle; }
      .box-struct { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
      .box-field { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
      .box-field-data { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.5; rx: 4; }
      .box-msg { fill: #ffffff; stroke: #10b981; stroke-width: 1.2; rx: 4; }
      .new-tag { fill: #dcfce7; stroke: #10b981; stroke-width: 1; rx: 7; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <text x="460" y="30" class="title">Part 2: discrete messages &amp; per-file cursor</text>

  <!-- Registration -->
  <rect x="40" y="50" width="840" height="90" class="box-struct" />
  <text x="55" y="70" class="field-title">MiscDeviceRegistration&lt;RustMessageBoard&gt;</text>
  <rect x="55" y="80" width="810" height="50" class="box-struct" />
  <text x="68" y="110" class="field-title">RustMessageBoard</text>
  <rect x="560" y="90" width="195" height="30" class="box-field" />
  <text x="570" y="110" class="field-val">shared: Arc&lt;SharedState&gt;</text>

  <!-- Open file A -->
  <rect x="40" y="170" width="300" height="150" class="box-struct" />
  <text x="52" y="188" class="addr-label">open file A</text>
  <text x="52" y="206" class="field-title">KBox&lt;RustMessageBoardFile&gt;</text>
  <rect x="52" y="216" width="276" height="24" class="box-field" />
  <text x="62" y="233" class="field-val">shared: Arc&lt;SharedState&gt;</text>
  <rect x="52" y="248" width="276" height="24" class="box-field" />
  <text x="62" y="265" class="field-val">dev: ARef&lt;Device&gt;</text>
  <rect x="52" y="280" width="276" height="28" class="box-field-data" />
  <text x="62" y="299" class="field-val">cursor: Mutex&lt;usize&gt; = 1</text>
  <rect x="284" y="287" width="34" height="14" class="new-tag" />
  <text x="301" y="298" class="new-tag-text">new</text>

  <!-- Open file B -->
  <rect x="40" y="345" width="300" height="150" class="box-struct" />
  <text x="52" y="363" class="addr-label">open file B</text>
  <text x="142" y="363" class="index-label">at end → read() returns 0</text>
  <text x="52" y="381" class="field-title">KBox&lt;RustMessageBoardFile&gt;</text>
  <rect x="52" y="391" width="276" height="24" class="box-field" />
  <text x="62" y="408" class="field-val">shared: Arc&lt;SharedState&gt;</text>
  <rect x="52" y="423" width="276" height="24" class="box-field" />
  <text x="62" y="440" class="field-val">dev: ARef&lt;Device&gt;</text>
  <rect x="52" y="455" width="276" height="28" class="box-field-data" />
  <text x="62" y="474" class="field-val">cursor: Mutex&lt;usize&gt; = 3</text>
  <rect x="284" y="462" width="34" height="14" class="new-tag" />
  <text x="301" y="473" class="new-tag-text">new</text>

  <!-- SharedState (single heap allocation) -->
  <rect x="470" y="170" width="410" height="325" class="box-struct" />
  <text x="485" y="190" class="field-title">SharedState</text>
  <text x="485" y="207" class="addr-label">(refcounted heap alloc)</text>
  <rect x="485" y="218" width="380" height="264" class="box-field" />
  <text x="498" y="238" class="field-title">inner: Mutex&lt;Inner&gt;</text>
  <rect x="500" y="250" width="350" height="220" class="box-field-data" />
  <text x="512" y="271" class="field-val">Inner {</text>
  <text x="526" y="293" class="field-val">messages: KVec&lt;KVec&lt;u8&gt;&gt;</text>
  <rect x="710" y="282" width="34" height="14" class="new-tag" />
  <text x="727" y="293" class="new-tag-text">new</text>
  <rect x="526" y="304" width="300" height="30" class="box-msg" />
  <text x="538" y="323" class="field-val">[0] "first\n"</text>
  <rect x="526" y="342" width="300" height="30" class="box-msg" />
  <text x="538" y="361" class="field-val">[1] "second\n"</text>
  <rect x="526" y="380" width="300" height="30" class="box-msg" />
  <text x="538" y="399" class="field-val">[2] "third\n"</text>
  <text x="538" y="430" class="index-label">len = 3</text>
  <text x="512" y="456" class="field-val">}</text>

  <!-- Cursor index arrow (dashed gray, not an Arc) -->
  <path d="M 328 294 C 420 294, 440 357, 522 357" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gray)" />
  <text x="350" y="285" class="index-label">next read</text>

  <!-- Arc pointer arrows -->
  <path d="M 657 120 L 657 166" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <path d="M 328 228 C 400 228, 400 230, 466 230" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <path d="M 328 403 C 400 403, 400 450, 466 450" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)" />

  <text x="460" y="530" class="annot">Messages are shared; each open file has its own cursor.</text>
</svg>
