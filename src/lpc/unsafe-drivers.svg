    <text x="180.0" y="26" class="chart-title">Null Block driver</text>
    <circle cx="125.0" cy="120.0" r="72.0" fill="#004586" />
    <rect x="235" y="100" width="11" height="11" fill="#004586" />
    <text x="252" y="106" class="legend-text">Safe Rust</text>
    <rect x="235" y="124" width="11" height="11" fill="#ff420e" />
