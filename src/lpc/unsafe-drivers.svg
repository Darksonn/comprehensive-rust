    <path d="M 125.0,120.0 L 125.00,48.00 A 72.0,72.0 0 1,0 142.47,50.15 Z" fill="#004586" />
    <path d="M 125.0,120.0 L 142.47,50.15 A 72.0,72.0 0 0,0 125.00,48.00 Z" fill="#ff420e" />
    <rect x="235" y="100" width="11" height="11" fill="#004586" />
    <text x="252" y="106" class="legend-text">Safe Rust</text>
    <rect x="235" y="124" width="11" height="11" fill="#ff420e" />
    <text x="252" y="130" class="legend-text">Unsafe Rust</text>
  </g>
  <!-- Top-right: Panic QR code (912 Safe, 3 Unsafe) -->
