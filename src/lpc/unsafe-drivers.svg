<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="100%" height="100%">
  <style>
    .chart-title { font-family: "Liberation Sans", Arial, sans-serif; font-size: 18px; fill: #000000; text-anchor: middle; }
    .legend-text { font-family: "Liberation Sans", Arial, sans-serif; font-size: 13.5px; fill: #000000; dominant-baseline: middle; }
  </style>
  <!-- Top-left: Rust Binder (96.1% Safe, 3.9% Unsafe) -->
